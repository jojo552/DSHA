name: Claude 与 Android 兼容检查

on:
  push:
    branches: [feat/claude-code-android6]
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle/**'
      - '.github/workflows/claude-android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android 编译平台
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: SDK 与手机 MCP 协议验证
        run: |
          node tools/test-claude-agent.mjs
          node tools/test-claude-browser.mjs
          node tools/test-android-computer-use.mjs
          python3 tools/test-bridge-routes.py
          bash -n app/src/main/assets/claude/install.sh
      - name: 验证锁定的官方 CLI 与 SDK
        # 仅安装及检查入口，不发送模型请求或使用账号凭据。
        run: |
          npm ci --prefix app/src/main/assets/claude --no-audit --no-fund
          app/src/main/assets/claude/node_modules/.bin/claude --version
          node tools/check-claude-login.mjs
          node --input-type=module -e "import { query } from './app/src/main/assets/claude/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs'; if (typeof query !== 'function') process.exit(1);"
      - name: 两版 Java 编译与单元测试
        # 编译无需离线 Ubuntu 镜像；此任务不产生或发布可安装 APK。
        run: bash gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest -x prepareStandardAssets --no-daemon
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
